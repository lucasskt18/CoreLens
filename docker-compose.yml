services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: corelens-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: corelens
      POSTGRES_PASSWORD: corelens
      POSTGRES_DB: corelens
    volumes:
      - corelens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corelens -d corelens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corelens-db:
